name: Annonces du gouvernement (page Exécutif)
on:
  schedule:
    # Six passages par jour, tous en heures creuses DeepSeek (tarif moitié prix : hors 01h-04h et
    # 06h-10h UTC en semaine) : collecte, tri, analyse des nouvelles annonces.
    - cron: '20 5,10,13,16,19,22 * * *'
  workflow_dispatch:
concurrency:
  group: executif-annonces
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  annonces:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Rédaction : DeepSeek V4-Pro ; vérification : Claude Haiku (src/lib/redaction-ia.ts).
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AGENTIK_API_KEY: ${{ secrets.AGENTIK_API_KEY }}
      # Plafond : 20 $ par MOIS pour tout Claude, dont 8,40 $ pour cette page (budget-claude.ts,
      # choix de l'éditeur du 29/10/2026). Ne pas relever sans son accord.
      CLAUDE_BUDGET_MOIS: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      - run: npm run automation:executif-annonces

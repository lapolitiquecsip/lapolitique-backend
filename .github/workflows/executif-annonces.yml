name: Annonces du gouvernement (page Exécutif)
on:
  schedule:
    # Toutes les 3 heures de 7 h à 23 h (heure de Paris) : collecte, tri, analyse des nouvelles annonces.
    - cron: '20 5,8,11,14,17,20 * * *'
  workflow_dispatch:
concurrency:
  group: executif-annonces
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  annonces:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Plafond : 20 $ par MOIS pour tout Claude, dont 8,40 $ pour cette page (budget-claude.ts,
      # choix de l'éditeur du 29/10/2026). Ne pas relever sans son accord.
      CLAUDE_BUDGET_MOIS: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      - run: npm run automation:executif-annonces

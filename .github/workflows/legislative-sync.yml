name: Legislative data sync

on:
  schedule:
    # Horaire (et non toutes les 30 min) : le pipeline enchaîne ~14 étapes dont 4 lourdes en IA
    # (résumés scrutins/auditions, titres, impact citoyen). 30 min ne suffisaient pas → le job
    # était annulé (timeout) avant la queue (titres d'affichage, reconcile, navette), et l'IA
    # tournait 48×/j. Horaire = toutes les étapes finissent et coût IA divisé par 2.
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: legislative-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run automation:laws
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run automation:senate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run automation:senate:amendments
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run automation:senate:scrutins
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Résumé « en clair » des nouveaux scrutins du Sénat (IA, ne traite que les manquants).
      - run: npm run data:summarize-scrutins
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
      # Résumés IA des auditions/travaux de commission (comptes rendus écrits officiels).
      - run: npm run data:sync-commission-reports -- --limit=25
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
      # Recalcule le taux de présence des sénateurs après mise à jour des scrutins.
      - run: npm run data:sync-senator-participation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run automation:votes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run data:sync-initiative-counts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Résumé « impact citoyen » des lois promulguées (pour le livre du Journal Officiel).
      - run: npm run data:sync-dossier-titles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
      - run: npm run data:sync-law-citizen-impact
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
      - run: npm run automation:legislative:reconcile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Étape navette des scrutins AN (transmis au Sénat / adopté définitivement),
      # dérivée de l'état réel des dossiers : à faire après titres/dossiers.
      - run: npm run data:sync-scrutins-navette
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Monitoring Healthchecks : on re-route le check « laws » (dont le script d'origine
      # fetch-laws.ts est mort) vers CE pipeline législatif réel. Ping succès / échec.
      # Régler la période du check sur ~1 h côté healthchecks.io (ce cron tourne toutes les 30 min).
      - name: Healthcheck laws (succès)
        if: success()
        run: curl -fsS -m 10 --retry 3 "https://hc-ping.com/${{ secrets.HEALTHCHECK_ID_LAWS }}" || true
      - name: Healthcheck laws (échec)
        if: failure()
        run: curl -fsS -m 10 --retry 3 "https://hc-ping.com/${{ secrets.HEALTHCHECK_ID_LAWS }}/fail" || true

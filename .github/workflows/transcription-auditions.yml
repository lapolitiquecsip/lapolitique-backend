name: Auditions sans compte rendu (transcription)
# Agent « transcripteur » du cycle des auditions : retrouve la vidéo d'une réunion filmée
# sans compte rendu écrit, la transcrit (Whisper, via Groq), l'analyse et la met en ligne.
#
# Le script vit dans le dépôt du site (scripts/transcribe-auditions.ts), mais la tâche tourne
# ICI : c'est ce dépôt qui détient la clé de transcription (secret GROQ_API_KEY) et le journal
# des cycles. Le dépôt du site est public, il se récupère sans jeton.
on:
  schedule:
    # Quatre passages par jour : le service de transcription gratuit accorde deux heures
    # d'enregistrement par heure, soit une à deux auditions par passage.
    - cron: '50 7 * * *'
    - cron: '50 11 * * *'
    - cron: '50 15 * * *'
    - cron: '50 19 * * *'
  # Un passage dès que ce fichier change : les déclenchements programmés de GitHub sautent
  # parfois des journées entières (aucun passage le 09/11 avant 16 h UTC).
  push:
    branches: [main]
    paths: ['.github/workflows/transcription-auditions.yml']
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre d'auditions à traiter"
        required: false
        default: "6"
concurrency:
  group: transcription-auditions
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  transcrire:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Récupérer le dépôt du site
        uses: actions/checkout@v4
        with:
          repository: lapolitiquecsip/politique-pour-tous
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # ffmpeg n'est plus fourni d'office sur les machines de GitHub : on l'installe, et on
      # s'arrête ici s'il manque (le contrôle précédent, « ffmpeg | head », réussissait même absent).
      - name: Installer ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version > /dev/null && echo "ffmpeg prêt"
      - name: Transcrire et analyser
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ASR_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        # 2 h d'audio au plus par passage, quatre passages : 8 h par jour, la limite gratuite de
        # Groq (whisper-large-v3). Réunions les plus récentes d'abord, rattrapage depuis le 1er octobre.
        run: npx --yes tsx scripts/transcribe-auditions.ts --limit=${{ github.event.inputs.limit || '6' }} --heures=2

name: Rattrapage du fil contrôlé des candidats

# Opération ponctuelle du 30/10/2026 : reconstruit le fil sur 30 jours avec les articles contrôlés, puis
# les preuves de candidature. Sur GitHub car seule sa clé DeepSeek est valide. Coût plafonné ci-dessous.
on:
  push:
    branches: [main]
    paths: [".github/workflows/rattrapage-fil-candidats.yml"]
  workflow_dispatch:

concurrency:
  group: presidentielles-sync
  cancel-in-progress: false

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AGENTIK_API_KEY: ${{ secrets.AGENTIK_API_KEY }}
      LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      - run: npx tsx src/scripts/automation/presidential-news.ts --rattrapage
        timeout-minutes: 110
        continue-on-error: true
        env:
          AGENTIK_PLAFOND_OPERATION: "0.8"
      - run: npx tsx src/scripts/automation/candidatures-preuves.ts --force
        timeout-minutes: 30
        env:
          AGENTIK_PLAFOND_OPERATION: "0.3"

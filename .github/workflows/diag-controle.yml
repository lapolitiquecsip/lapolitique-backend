name: Diagnostic du controle

on:
  push:
    branches: [main]
    paths: [".github/workflows/diag-controle.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AGENTIK_API_KEY: ${{ secrets.AGENTIK_API_KEY }}
      LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
      VERIF_PAYANT: "1"
      AGENTIK_PLAFOND_OPERATION: "0.03"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      - run: npx tsx src/scripts/data/diag-controle.ts

name: Bulk Law Summarization

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of laws to summarize'
        required: true
        default: '500'
        type: string

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run bulk summarizer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SUMMARIZE_LIMIT: ${{ inputs.limit }}
        run: npm run automation:law-summarizer

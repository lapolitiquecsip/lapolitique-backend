name: Commune news feed (#1)
on:
  schedule:
    # 7 h 20 UTC, juste après la remise à zéro du quota Gemini gratuit (minuit, heure
    # du Pacifique). Le soir, les autres tâches d'IA l'ont déjà vidé : de mi-septembre
    # au 29, ce fil ne recevait presque plus rien.
    - cron: '20 7 * * *'
  workflow_dispatch:
concurrency:
  group: commune-news
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  commune-news:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      INSTITUTION_NEWS_ONLY_TYPE: commune
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      # Communes > 20 000 hab : fil d'actu locale (projets mairie, travaux, décisions, événements).
      - run: npm run data:seed-entity-feed-sources
      - run: npm run automation:institution-news

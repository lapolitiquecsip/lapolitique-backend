name: Commune news feed (#1)
on:
  schedule:
    - cron: '37 19 * * *'   # chaque jour ~21h37 Paris (heures creuses DeepSeek)
  workflow_dispatch:
concurrency:
  group: commune-news
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  commune-news:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      INSTITUTION_NEWS_ONLY_TYPE: commune
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      # Communes > 20 000 hab : fil d'actu locale (projets mairie, travaux, décisions, événements).
      - run: npm run data:seed-entity-feed-sources
      - run: npm run automation:institution-news

name: Niches parlementaires (page Assemblée)
on:
  schedule:
    # Deux passages par jour, en heures creuses DeepSeek (hors 01h-04h et 06h-10h UTC en semaine) :
    # l'agenda et les dossiers de l'Assemblée sont republiés dans la nuit.
    - cron: '40 11,22 * * *'
  workflow_dispatch:
    inputs:
      analyse:
        description: "Refaire l'analyse d'une niche (AAAA-MM-JJ), même inchangée"
        required: false
concurrency:
  group: niches-parlementaires
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  niches:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Rédaction : DeepSeek V4-Pro ; vérification : Claude Haiku (src/lib/redaction-ia.ts).
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Plafond : 20 $ par MOIS pour toute l'IA payante, dont 1 $ pour les niches (budget-claude.ts).
      CLAUDE_BUDGET_MOIS: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      - run: npm run automation:niches -- ${{ github.event.inputs.analyse && format('--analyse={0}', github.event.inputs.analyse) || '' }}

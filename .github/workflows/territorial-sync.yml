name: Territorial data
on:
  schedule:
    - cron: '31 2 * * 1'
    - cron: '47 3 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [incremental, backfill, dry-run]
        default: incremental
concurrency:
  group: territorial-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INGESTION_MODE: ${{ inputs.mode || 'incremental' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      - run: npm run data:register-sources
      - run: npm run compile:official-territories
      - run: npm run data:sync-territories
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: territorial-sync-diagnostics
          path: data/official-local/
          retention-days: 7

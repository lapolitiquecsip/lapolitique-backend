name: Legislative analyses
on:
  schedule:
    - cron: '17 0,17,18,19,20,21,22,23 * * *'   # horaire, uniquement en heures creuses DeepSeek (16h30-00h30 UTC)
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [incremental, backfill, dry-run]
        default: incremental
      max_items:
        type: number
        default: 50
concurrency:
  group: legislative-analysis
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      INGESTION_MODE: ${{ inputs.mode || 'incremental' }}
      LEGISLATIVE_SUMMARY_LIMIT: ${{ inputs.max_items || 50 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      # 1) Dossiers récents actifs + promulgués (fenêtre standard).
      - run: npm run automation:legislative:summaries
      # 2) Comble le RETARD : dossiers sans analyse (anciens, Sénat…), par lots, jusqu'à épuisement.
      - run: npm run automation:legislative:summaries
        env:
          SUMMARY_FILL_MISSING: "1"
          LEGISLATIVE_SUMMARY_LIMIT: "120"
      # 3) Données VISUELLES de l'analyse détaillée (essence / avant-après / impacts / vote),
      #    extraites de l'analyse premium existante (aucune invention). Par lots.
      - run: npm run automation:law-visual
        env:
          LAW_VISUAL_BATCH: "80"

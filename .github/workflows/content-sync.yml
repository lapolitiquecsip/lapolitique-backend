name: Content feed (média)
on:
  schedule:
    - cron: '23 17,19,21,23 * * *'   # toutes les 2h, en heures creuses DeepSeek (16h30-00h30 UTC)
  workflow_dispatch:
concurrency:
  group: content-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      HEALTHCHECK_ID_ASSEMBLEE: ${{ secrets.HEALTHCHECK_ID_ASSEMBLEE }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      - run: npm run automation:content

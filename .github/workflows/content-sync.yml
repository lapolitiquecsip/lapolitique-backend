name: Content feed (média)
on:
  schedule:
    # En journée, après 07:00 UTC (remise à zéro du quota Gemini gratuit). Le soir, ce
    # passage « réussissait » sans rien publier : quota déjà vidé par les autres tâches,
    # le fil d'accueil ne recevait plus que 1 à 15 articles par jour.
    - cron: '23 9,13,17 * * *'
  workflow_dispatch:
concurrency:
  group: content-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      HEALTHCHECK_ID_ASSEMBLEE: ${{ secrets.HEALTHCHECK_ID_ASSEMBLEE }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      - run: npm run automation:content

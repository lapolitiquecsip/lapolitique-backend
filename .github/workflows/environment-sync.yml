name: Daily environmental indicators
on:
  schedule:
    - cron: '52 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [incremental, backfill, dry-run]
        default: incremental
concurrency:
  group: environment-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INGESTION_MODE: ${{ inputs.mode || 'incremental' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      - run: npm run data:sync-atmo

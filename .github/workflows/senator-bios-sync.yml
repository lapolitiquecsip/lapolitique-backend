name: Bios sénateurs (Wikipédia + IA)
on:
  schedule:
    - cron: '50 22 * * *'   # quotidien ~00h50 Paris (22h50 UTC = heures creuses DeepSeek 16h30-00h30 UTC) ; rattrape le backlog par lots
  workflow_dispatch:
    inputs:
      force:
        description: "Retraiter toutes les bios (sinon seulement les génériques)"
        type: boolean
        default: false
concurrency:
  group: senator-bios-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  bios:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      # Par défaut : par lots de 60/jour (heures creuses), reprenable — ne (re)traite que les bios
      # manquantes/anciennes. force=true retraite tout.
      - run: npm run data:sync-senator-bios -- ${{ inputs.force && '--force' || '--limit=60' }}

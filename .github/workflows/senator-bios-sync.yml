name: Sénateurs — groupes, commissions et bios
on:
  schedule:
    # Tous les jours, juste après la remise à zéro du quota IA gratuit (07:00 UTC) :
    # le passage hebdomadaire du dimanche soir trouvait le quota vide et n'écrivait rien.
    # Sans bio à faire, le passage se limite à relire les fiches senat.fr.
    - cron: '10 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Retraiter toutes les bios (sinon seulement les manquantes)"
        type: boolean
        default: false
concurrency:
  group: senator-bios-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  bios:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      # 1) Groupe et commission lus sur les fiches senat.fr (plus à jour que l'open data ODSEN).
      - run: npm run data:sync-senateurs-senatfr
        continue-on-error: true
      # 2) Bios structurées : fiche officielle senat.fr + Wikipédia. Nouveaux élus d'abord,
      #    sénateurs sortis ignorés ; s'arrête proprement si le quota IA est épuisé.
      - run: npm run data:sync-senator-bios -- ${{ inputs.force && '--force' || '--limit=80' }}

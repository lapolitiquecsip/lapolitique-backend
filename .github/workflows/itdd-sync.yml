name: Indicateurs développement durable (ITDD)
on:
  schedule:
    - cron: '40 3 5 * *'   # mensuel, le 5 (le jeu de données est annuel)
  workflow_dispatch:
concurrency:
  group: itdd-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      - run: npm run data:sync-itdd

name: Petitions and official content
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [incremental, backfill, dry-run]
        default: incremental
concurrency:
  group: petitions-content-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INGESTION_MODE: ${{ inputs.mode || 'incremental' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      - run: npm run automation:petitions

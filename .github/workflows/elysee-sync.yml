name: Elysee (presidence)
on:
  schedule:
    - cron: '15 4 * * *'   # quotidien, hors heures de pointe
  workflow_dispatch:
concurrency:
  group: elysee-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      # Garde-fou budget DeepSeek : si solde épuisé, les étapes IA sont ignorées (job reste vert).
      - id: budget
        run: npm run automation:budget-check
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
      - run: npm run data:sync-elysee
      # Fil video (chaine YouTube officielle de l Elysee)
      - run: npm run data:sync-elysee-videos
      # Fil video de l'Assemblee nationale (chaine officielle LCP)
      - run: npm run data:sync-an-videos
      # Fil video du Senat (chaine officielle Public Senat)
      - run: npm run data:sync-senat-videos
      # Resumes IA des comptes rendus du Conseil des ministres
      - run: npm run data:summarize-elysee
        if: steps.budget.outputs.has_budget == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
      # Seed des engagements figés (programme officiel 2022)
      - run: npm run data:sync-president-program
        if: steps.budget.outputs.has_budget == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
      # Évaluation ANCRÉE de l'avancement : preuves officielles (scrutins/dossiers) + web
      # (Wikipédia), puis connaissance des faits 2022-2026. C'est CETTE passe qui fixe les statuts.
      - run: npm run data:assess-program
        if: steps.budget.outputs.has_budget == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}   # optionnel : recherche web plein-texte

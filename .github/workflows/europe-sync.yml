name: Eurodéputés (Parlement européen)
on:
  schedule:
    - cron: '25 3 * * 4'   # hebdo (jeudi 03h25 UTC) : votes + liste
    - cron: '45 2 7 * *'   # mensuel (le 7) : bios des nouveaux
  workflow_dispatch:
concurrency:
  group: europe-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  europe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      # 1) Liste officielle (noms, groupes, photos)
      - run: npm run data:sync-meps
      # 2) Historique de votes (HowTheyVote)
      - run: npm run data:sync-mep-votes
      # 3) Bios des eurodéputés encore sans portrait (peu d'appels IA)
      - run: npm run data:sync-mep-bios
      # Bio structuree (panneaux) des nouveaux eurodeputes
      - run: npm run data:sync-mep-bios-structured
      # 4) Catégorisation par domaine des votes (classification officielle, déterministe)
      - run: npm run data:sync-vote-categories
      # 5) Résultats de vote par groupe (officiel HowTheyVote)
      - run: npm run data:sync-vote-group-results
      # 5) Explications IA des votes principaux (ne (re)génère que les manquants)
      - run: npm run data:sync-vote-explanations

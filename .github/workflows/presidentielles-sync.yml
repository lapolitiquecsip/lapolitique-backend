name: Présidentielles 2027
on:
  schedule:
    # 08:35 UTC, après la remise à zéro du quota Gemini gratuit (07:00 UTC). À 23:35 UTC
    # (exécuté vers 02:30 par GitHub), le quota du jour était vide et le passage échouait.
    - cron: '35 8 * * *'
  workflow_dispatch:
concurrency:
  group: presidentielles-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  presidentielles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AGENTIK_API_KEY: ${{ secrets.AGENTIK_API_KEY }}
      LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}   # recherche web des positions candidats
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      # 0) Garde-fou budget DeepSeek : si solde épuisé, les étapes IA sont ignorées (job reste vert).
      - id: budget
        run: npm run automation:budget-check
      # 1) Détecte et ajoute les nouveaux candidats déclarés
      - run: npm run automation:presidential
        if: steps.budget.outputs.has_budget == 'true'
      # 2) Programmes AVANT la presse (29/10/2026) : la collecte de presse dure jusqu'à 40 min ;
      #    placée devant, elle faisait couper le passage par la limite de temps, et les
      #    programmes n'étaient plus relevés un jour sur deux (21, 23, 26 et 28/10).
      #    Propositions/idées de chaque candidat (site officiel du mouvement).
      - run: npm run data:sync-candidate-proposals
      # 2bis) Explique chaque proposition (le « ? ») avec chiffres nationaux vérifiés.
      - run: npm run data:explain-proposals
      # 3) Fil d'actualité de chaque candidat : chaque article est lu et contrôlé avant publication.
      - run: npm run automation:presidential-news
        timeout-minutes: 25
        continue-on-error: true
      # 3ter) Preuve de candidature de chaque personne (le lundi).
      - run: npm run automation:candidatures-preuves
        timeout-minutes: 15
        continue-on-error: true
      # 3bis) Fil vidéo de chaque candidat (YouTube officiel, RSS — aucun coût IA).
      - run: npm run data:sync-candidate-videos
      # 3) Positions sourcées (Wikipédia) des candidats sur les grands enjeux
      - run: npm run automation:candidate-positions
        if: steps.budget.outputs.has_budget == 'true'
      # 4) Positions via votes réels au Parlement (prioritaires sur Wikipédia)
      - run: npm run automation:candidate-positions-votes
        if: steps.budget.outputs.has_budget == 'true'

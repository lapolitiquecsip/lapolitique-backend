name: Présidentielles 2027
on:
  schedule:
    - cron: '35 5 * * *'   # chaque jour ~07h35 Paris
  workflow_dispatch:
concurrency:
  group: presidentielles-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  presidentielles:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      # 1) Détecte et ajoute les nouveaux candidats déclarés
      - run: npm run automation:presidential
      # 2) Met à jour le fil d'actualité de chaque candidat
      - run: npm run automation:presidential-news

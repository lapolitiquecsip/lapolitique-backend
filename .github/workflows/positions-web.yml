name: Positions candidats (sources web · Crawl4AI)
on:
  schedule:
    - cron: '5 22 * * *'   # chaque jour ~00h05 Paris (heures creuses DeepSeek)
  workflow_dispatch:
concurrency:
  group: positions-web
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  positions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install -r python/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run positions web
        run: python python/positions_web.py

name: Décrets JORF (Journal Officiel)
on:
  schedule:
    - cron: '40 6 * * *'   # chaque jour ~08h40 Paris (le JO paraît le matin) — pas de DeepSeek, coût nul
  workflow_dispatch:
concurrency:
  group: decrees-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  decrees:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      - run: npm run data:sync-decrees

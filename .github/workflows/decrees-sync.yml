name: Décrets JORF (Journal Officiel)
on:
  schedule:
    - cron: '40 23 * * *'   # ~00h40 Paris = heures CREUSES DeepSeek (le résumé des décrets du JO du
                            # matin est fait le soir même). 06:40 UTC tombait en heures PLEINES (2× le prix).
  workflow_dispatch:
concurrency:
  group: decrees-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  decrees:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      # 1) Récupère les décrets du JO (gratuit, sans IA)
      - run: npm run data:sync-decrees
      # 2) Résumés : règles pour nominations/distinctions ; IA (coût infime) pour les réglementaires
      - run: npm run data:summarize-decrees
      # 3) Titres synthétisés (le sujet, sans « Décret n°… portant … ») pour l'affichage
      - run: npm run data:sync-decree-titles
      # 4) Rattache les décrets au ministère émetteur (via NOR) → fil d'action des ministères (gratuit)
      - run: npm run data:sync-ministry-decrees

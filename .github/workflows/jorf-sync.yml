name: JORF promulgation sync

on:
  schedule:
    # Le JO du jour paraît sur Légifrance/DILA le matin (édition parfois tardive). Pour que la
    # loi soit inscrite « dès sa parution », on passe d'1×/jour à toutes les 2 h sur la fenêtre
    # 06 h–22 h (Paris). Chaque run ne télécharge QUE la dernière archive JORFSIMPLE du jour
    # (léger, idempotent) → aucun risque pour le flux DILA.
    - cron: "0 4-20/2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run automation:jorf
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

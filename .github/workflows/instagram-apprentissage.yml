name: Instagram — Noémie apprend
# Toutes les 6 heures : relève les statistiques du compte et des posts (gratuit, sans IA), puis traite
# les décisions d'Hippolyte sur la stratégie (WhatsApp). Le lundi à 05:17 UTC (heures creuses DeepSeek) :
# analyse de la semaine et nouvelle stratégie proposée sur WhatsApp. Voir src/scripts/marketing/.
on:
  schedule:
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode : normal, tout (relire tous les posts), analyse (forcer l'analyse), initiale (proposer la v1)"
        type: choice
        options: [normal, tout, analyse, initiale]
        default: normal
concurrency:
  group: instagram-apprentissage
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  apprendre:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      - run: npx tsx src/scripts/marketing/instagram-stats.ts ${{ inputs.mode == 'tout' && '--tout' || '' }}
        continue-on-error: true
      # Rose : applique les choix de portraits ; dit s'il y a du détourage à faire (photos envoyées
      # sur WhatsApp, nouveaux candidats sans portrait). Le détourage (Python, modèles U²-Net et YuNet
      # gardés en cache) ne s'installe QUE dans ce cas : les passages ordinaires restent rapides.
      - id: rose
        run: npx tsx src/scripts/marketing/rose-portraits.ts
      - if: fromJSON(steps.rose.outputs.recus || '0') > 0 || fromJSON(steps.rose.outputs.manquants || '0') > 0
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: fromJSON(steps.rose.outputs.recus || '0') > 0 || fromJSON(steps.rose.outputs.manquants || '0') > 0
        uses: actions/cache@v4
        with:
          path: ~/modeles
          key: modeles-detourage-v1
      - if: fromJSON(steps.rose.outputs.recus || '0') > 0 || fromJSON(steps.rose.outputs.manquants || '0') > 0
        name: Détourage — dépendances et modèles
        run: |
          pip install -q onnxruntime numpy pillow opencv-python-headless
          mkdir -p ~/modeles
          [ -s ~/modeles/u2net_human_seg.onnx ] || curl -sSfL -o ~/modeles/u2net_human_seg.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net_human_seg.onnx
          [ -s ~/modeles/yunet.onnx ] || curl -sSfL -o ~/modeles/yunet.onnx https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
      - if: fromJSON(steps.rose.outputs.recus || '0') > 0
        name: Détourage — photos envoyées sur WhatsApp
        run: python scripts/visuels/detourer.py --modele ~/modeles/u2net_human_seg.onnx --visages ~/modeles/yunet.onnx --recus
      - if: fromJSON(steps.rose.outputs.manquants || '0') > 0
        name: Détourage — portraits proposés pour les nouveaux candidats
        run: python scripts/visuels/detourer.py --modele ~/modeles/u2net_human_seg.onnx --visages ~/modeles/yunet.onnx --proposer --programmes --manquants
        continue-on-error: true
      - run: npx tsx src/scripts/marketing/noemie-strategie.ts ${{ inputs.mode == 'analyse' && '--analyse' || '' }} ${{ inputs.mode == 'initiale' && '--initiale' || '' }}
        if: ${{ !cancelled() }}

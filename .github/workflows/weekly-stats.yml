name: Weekly stats (fun facts)
on:
  schedule:
    - cron: '0 22 * * 1'   # lundi ~00h00 Paris (heures creuses DeepSeek)
  workflow_dispatch:
concurrency:
  group: weekly-stats
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  weekly-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
      HEALTHCHECK_ID_WEEKLY_STATS: ${{ secrets.HEALTHCHECK_ID_WEEKLY_STATS }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      - run: npm run automation:weekly-stats

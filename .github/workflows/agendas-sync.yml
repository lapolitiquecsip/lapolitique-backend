name: Institutional agendas
on:
  schedule:
    - cron: '23 17,20,23 * * *'   # toutes les 3h, en heures creuses DeepSeek (16h30-00h30 UTC)
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [incremental, backfill, dry-run]
        default: incremental
concurrency:
  group: agendas-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      INGESTION_MODE: ${{ inputs.mode || 'incremental' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      - run: npm run automation:agenda

name: Alertes membres et récap hebdomadaire
on:
  schedule:
    # Toutes les heures : analyse des nouveaux textes et alertes « un texte vous concerne »
    # (la seule alerte immédiate des membres Pro), mise à jour des suivis et du territoire.
    - cron: '15 * * * *'
    # Chaque soir : le résumé quotidien des membres NON Pro (inchangé pour eux).
    - cron: '30 17 * * *'
    # Samedi : « La semaine politique en 5 minutes ». Le script ne part qu'à 8 h,
    # heure de Paris (6 h UTC l'été, 7 h UTC l'hiver).
    - cron: '0 6,7 * * 6'
    - cron: '0 16 * * 5'      # vendredi 18 h Paris (17 h l'hiver) : relecture du récap par l'administrateur
  workflow_dispatch:
    inputs:
      etape:
        description: "alertes | soir | recap | relecture"
        default: alertes
concurrency:
  group: alertes-pro
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  alertes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      SITE_URL: https://lapolitiquecestsimple.fr
      ETAPE: ${{ github.event.schedule == '0 6,7 * * 6' && 'recap' || github.event.schedule == '0 16 * * 5' && 'relecture' || github.event.schedule == '30 17 * * *' && 'soir' || inputs.etape || 'alertes' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      - run: npm run automation:alertes-textes
        if: env.ETAPE == 'alertes'
        continue-on-error: true
      - run: npm run automation:suivis-notifications
        if: env.ETAPE == 'alertes'
        continue-on-error: true
      - run: npm run automation:interest-notifications
        if: env.ETAPE == 'alertes'
        continue-on-error: true
      - run: npm run automation:send-notification-emails -- --mode=immediat
        if: env.ETAPE == 'alertes'
      - run: npm run automation:send-notification-emails -- --mode=quotidien
        if: env.ETAPE == 'soir'
      # Conformité, une fois par jour : durées de conservation (RGPD art. 5.1.e) et rappel
      # d'échéance des abonnements annuels (C. conso. L215-1, fonction Edge « abonnement »).
      - name: Purge des données échues
        if: env.ETAPE == 'soir'
        continue-on-error: true
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/purge_conservation"             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" -d '{}'
      - name: Rappels d'échéance des abonnements annuels
        if: env.ETAPE == 'soir'
        continue-on-error: true
        run: |
          curl -sf -X POST "$SUPABASE_URL/functions/v1/abonnement"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" -d '{"action":"rappels"}'
      # Parrainage : commissions validées virées automatiquement aux parrains (Stripe Connect).
      - name: Versement des commissions de parrainage
        if: env.ETAPE == 'soir'
        continue-on-error: true
        run: |
          curl -sf -X POST "$SUPABASE_URL/functions/v1/parrainage-versements" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" -d '{"action":"verser"}'
      - run: npm run automation:recap-hebdo -- --relecture
        if: env.ETAPE == 'relecture'
      - run: npm run automation:recap-hebdo ${{ github.event_name == 'workflow_dispatch' && '-- --force' || '' }}
        if: env.ETAPE == 'recap'

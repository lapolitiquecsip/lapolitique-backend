name: Fiches partis (datan + enrichissement)
on:
  schedule:
    - cron: '25 22 * * *'   # chaque jour ~00h25 Paris (heures creuses DeepSeek)
  workflow_dispatch:
concurrency:
  group: parties-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  parties:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      # 1) Fiches + statistiques datan (quotidien)
      - run: npm run data:sync-parties
      # 1b) Eurodéputés français (Parlement européen)
      - run: npm run data:sync-meps
      # 2) Enrichissement Wikipédia/IA (budget, adhérents, fondation…) — mis en cache
      - run: npm run data:enrich-parties
      # 3) Historique (adhérents Wikidata + résultats électoraux) — évolue avec la source
      - run: npm run data:party-history
      # 4) Finances curées (subventions publiques + endettement CNCCFP) — upsert idempotent, coût nul
      - run: npm run data:seed-party-finance

name: Instagram — production (Noémie, Basile, Rose)
# 8 h 10 (Paris) : prépare les carrousels du jour selon la stratégie active et les envoie sur WhatsApp
# (Gemini gratuit, quota remis à zéro à 8 h). Toutes les 15 min, 8 h-21 h : refait les posts « ✏️ »
# et publie ceux validés « ✅ » à l'heure de leur créneau. Voir src/scripts/marketing/instagram-production.ts.
on:
  schedule:
    - cron: '10 7 * * *'
    - cron: '*/15 7-20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "preparer (posts du jour) ou publier (✏️ et ✅ en attente)"
        type: choice
        options: [publier, preparer]
        default: publier
concurrency:
  group: instagram-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  preparer:
    if: github.event.schedule == '10 7 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'preparer')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      - run: npx playwright install --with-deps chromium
      - run: npx tsx src/scripts/marketing/instagram-production.ts --preparer
  publier:
    if: github.event.schedule != '10 7 * * *' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'publier')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      # Le navigateur ne s'installe que s'il y a un post à refaire après « ✏️ ».
      - id: besoin
        run: npx tsx src/scripts/marketing/instagram-production.ts --besoin
      - if: fromJSON(steps.besoin.outputs.refaire || '0') > 0
        run: npx playwright install --with-deps chromium
      - run: npx tsx src/scripts/marketing/instagram-production.ts --publier

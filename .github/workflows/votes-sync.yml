name: Votes des élus (scrutins AN → front)
on:
  schedule:
    - cron: '20 22 * * *'   # chaque jour ~00h20 Paris (heures creuses DeepSeek pour les résumés)
  workflow_dispatch:
concurrency:
  group: votes-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  votes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      # 0) Garde-fou budget DeepSeek : si le solde est épuisé, les étapes IA sont IGNORÉES
      #    (le job reste vert, les étapes gratuites ci-dessous tournent quand même).
      - id: budget
        run: npm run automation:budget-check
      # 1) Importe les scrutins + votes individuels (open data AN) → tables du front (gratuit)
      - run: npm run automation:fetch-votes
      # 2) Résume/explique les nouveaux scrutins (IA, heures creuses)
      - run: npm run automation:summarize
        if: steps.budget.outputs.has_budget == 'true'
      # 3) Tague par ENJEU les nouveaux scrutins (fondation #3, incrémental → quasi gratuit)
      - run: npm run data:seed-issues
      - run: npm run data:tag-scrutins   # AN (table scrutins)
        env:
          SCRUTIN_TAG_WRITE: "1"
      - run: npm run data:tag-scrutins   # Sénat (legislative_scrutins)
        env:
          SCRUTIN_TAG_WRITE: "1"
          TAG_SOURCE: senate
      # 4) Notifie les abonnés dont un élu suivi a voté sur un scrutin solennel
      - run: npm run automation:notifications
      # 5) Bios structurées des députés (IA, par lots ; reprenable jour après jour)
      - run: npm run data:sync-deputy-bios -- --limit=150
        if: steps.budget.outputs.has_budget == 'true'

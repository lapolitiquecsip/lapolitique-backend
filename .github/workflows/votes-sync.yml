name: Votes des élus (scrutins AN → front)
on:
  schedule:
    - cron: '20 22 * * *'   # chaque jour ~00h20 Paris (heures creuses DeepSeek pour les résumés)
  workflow_dispatch:
concurrency:
  group: votes-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  votes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # Monitoring Healthchecks : fetch-votes pinge ce check (start/success/fail). Sans cette
      # variable, le cron n'alimentait jamais le check « votes » → faux DOWN. Ajouter le secret
      # HEALTHCHECK_ID_VOTES dans les repo secrets GitHub (UUID déjà présent dans le .env local).
      HEALTHCHECK_ID_VOTES: ${{ secrets.HEALTHCHECK_ID_VOTES }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-data-job
      # 0) Garde-fou budget DeepSeek : si le solde est épuisé, les étapes IA sont IGNORÉES
      #    (le job reste vert, les étapes gratuites ci-dessous tournent quand même).
      - id: budget
        run: npm run automation:budget-check
      # 1) Importe les scrutins + votes individuels (open data AN) → tables du front (gratuit)
      - run: npm run automation:fetch-votes
      # 2) Résume/explique les nouveaux scrutins (IA, heures creuses)
      - run: npm run automation:summarize
        if: steps.budget.outputs.has_budget == 'true'
      # 3) Tague par ENJEU les nouveaux scrutins (fondation #3, incrémental → quasi gratuit)
      - run: npm run data:seed-issues
      - run: npm run data:tag-scrutins   # AN (table scrutins)
        env:
          SCRUTIN_TAG_WRITE: "1"
      - run: npm run data:tag-scrutins   # Sénat (legislative_scrutins)
        env:
          SCRUTIN_TAG_WRITE: "1"
          TAG_SOURCE: senate
      # 4) Notifie les abonnés dont un élu suivi a voté sur un scrutin solennel
      - run: npm run automation:notifications
      # 4a) Notifications PERSONNALISÉES premium (flux entity_feed → profils/intérêts). Aucun coût IA.
      - run: npm run automation:interest-notifications
      # 4bis) Envoie par e-mail les notifications non encore envoyées (digest quotidien).
      #       Dry-run tant que RESEND_API_KEY n'est pas fourni (log seulement).
      - run: npm run automation:send-notification-emails
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SITE_URL: https://lapolitiquecestsimple.fr
      # 5) Bios structurées des députés (IA). HEBDO (lundi uniquement) : les bios ne changent
      #    quasi jamais → une passe/semaine suffit et divise le coût DeepSeek de ce poste par ~7.
      - id: dow
        run: echo "monday=$([ "$(date -u +%u)" = "1" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - run: npm run data:sync-deputy-bios -- --limit=300
        if: steps.budget.outputs.has_budget == 'true' && steps.dow.outputs.monday == 'true'
